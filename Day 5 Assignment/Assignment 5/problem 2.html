<!DOCTYPE html>
<html>
<head>
    <title>Keyboard Layout</title>

    <style>
        body{
            margin:0;
            background:#12c6df;
            display:flex;
            justify-content:center;
            align-items:center;
            height:100vh;
        }

        .keyboard{
            background:#1f2a2f;
            padding:20px;
            border-radius:20px;
            display:grid;
            gap:15px;
            box-shadow:0px 10px 20px rgba(0,0,0,0.5);
        }

        .row{
            display:grid;
            grid-template-columns:repeat(12,80px);
            gap:15px;
        }

        .key{
            background:#2d373c;
            color:#00bfff;
            text-align:center;
            padding:10px 0;
            font-size:24px;
            font-weight:bold;
            border-radius:5px;
            box-shadow:5px 5px 10px rgba(0,0,0,0.5);
        }

        .wide{
            grid-column:span 2;
        }

        .space{
            grid-column:span 4;
        }

        .shift{
            grid-column:span 1;
        }
    </style>
</head>

<body>

<div class="keyboard">

    <div class="row">
        <div class="key">~</div>
        <div class="key">1</div>
        <div class="key">2</div>
        <div class="key">3</div>
        <div class="key">4</div>
        <div class="key">5</div>
        <div class="key">6</div>
        <div class="key">7</div>
        <div class="key">8</div>
        <div class="key">9</div>
        <div class="key">0</div>
        <div class="key">Delete</div>
    </div>

    <div class="row">
        <div class="key">Tab</div>
        <div class="key">Q</div>
        <div class="key">W</div>
        <div class="key">E</div>
        <div class="key">R</div>
        <div class="key">T</div>
        <div class="key">Y</div>
        <div class="key">U</div>
        <div class="key">I</div>
        <div class="key">O</div>
        <div class="key">P</div>
        <div class="key">\</div>
    </div>

    <div class="row">
        <div class="key">Caps</div>
        <div class="key">A</div>
        <div class="key">S</div>
        <div class="key">D</div>
        <div class="key">F</div>
        <div class="key">G</div>
        <div class="key">H</div>
        <div class="key">J</div>
        <div class="key">K</div>
        <div class="key">L</div>
        <div class="key wide">Enter</div>
    </div>

    <div class="row">
        <div class="key shift">Shift</div>
        <div class="key">Z</div>
        <div class="key">X</div>
        <div class="key">C</div>
        <div class="key">V</div>
        <div class="key">B</div>
        <div class="key">N</div>
        <div class="key">M</div>
        <div class="key">&lt;</div>
        <div class="key">&gt;</div>
        <div class="key shift">Shift</div>
    </div>

    <div class="row">
        <div class="key">🌐</div>
        <div class="key">Ctrl</div>
        <div class="key">Option</div>
        <div class="key">Alt</div>
        <div class="key space">Space</div>
        <div class="key">Alt</div>
        <div class="key">Option</div>
        <div class="key">←</div>
        <div class="key">→</div>
    </div>

</div>

</body>
</html>
